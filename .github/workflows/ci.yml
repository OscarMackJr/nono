name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      run_code_jobs: ${{ steps.classify.outputs.run_code_jobs }}
      run_docs_checks: ${{ steps.classify.outputs.run_docs_checks }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          run_code_jobs=true
          run_docs_checks=true

          case "${EVENT_NAME}" in
            pull_request)
              base_sha="${PR_BASE_SHA}"
              head_sha="${PR_HEAD_SHA}"
              diff_mode="merge-base"
              ;;
            push)
              base_sha="${PUSH_BEFORE_SHA}"
              head_sha="${PUSH_HEAD_SHA}"
              diff_mode="direct"
              ;;
            *)
              base_sha=""
              head_sha=""
              diff_mode=""
              ;;
          esac

          if [[ -n "${base_sha}" && -n "${head_sha}" && "${base_sha}" != "0000000000000000000000000000000000000000" ]]; then
            if [[ "${diff_mode}" == "merge-base" ]]; then
              mapfile -t changed_files < <(git diff --name-only "${base_sha}...${head_sha}")
            else
              mapfile -t changed_files < <(git diff --name-only "${base_sha}" "${head_sha}")
            fi

            if [[ ${#changed_files[@]} -gt 0 ]]; then
              run_code_jobs=false
              run_docs_checks=false

              for file in "${changed_files[@]}"; do
                [[ -z "${file}" ]] && continue
                echo "changed: ${file}"

                # Phase 117 review WR-07: `proj/` is force-included even though
                # it is Markdown, because the CONTRACT documents there are read
                # by the test tree (`include_str!`/`read_to_string`) and gated
                # by it. Without this a pull request that edits ONLY
                # `proj/SPEC-windows-fail-direction-contract.md` runs zero jobs
                # — and every SPEC defect this phase found was a SPEC-only
                # edit, so the gates built to catch them would not execute.
                #
                # Round-6 WR-05 widened this from `proj/` alone. The gate at the
                # other end stopped enumerating five files and started walking
                # the crate, which surfaced three more Markdown files the test
                # tree reads and asserts on:
                #
                #   crates/nono-cli/data/profile-authoring-guide.md
                #     include_str!'d into the shipped binary (config/embedded.rs)
                #     and asserted on by profile_cmd.rs
                #   docs/architecture/aipc-unix-futures.md
                #   .planning/PROJECT.md
                #     both read and asserted on by tests/adr_aipc_unix_futures.rs
                #
                # `.planning/PROJECT.md` is force-included as an EXACT PATH and
                # not as a `^\.planning/` tree: that tree is written by every
                # planning command, and running the full matrix on each of those
                # commits would be a large recurring cost for one guarded file.
                #
                # MUST STAY IN SYNC with every Markdown file the test tree
                # reads. `layer_registry_selfcheck.rs::
                # every_markdown_file_gated_by_a_test_runs_the_code_jobs`
                # enforces that from the other end — it discovers the reads and
                # fails the build if one is not covered here.
                if [[ ! "${file}" =~ (^docs/)|(\.md$)|(\.mdx$)|(^LICENSE$)|(^\.github/ISSUE_TEMPLATE/) ]] \
                   || [[ "${file}" =~ (^proj/)|(^crates/nono-cli/data/)|(^docs/architecture/) ]] \
                   || [[ "${file}" == ".planning/PROJECT.md" ]]; then
                  run_code_jobs=true
                fi

                if [[ "${file}" =~ (^docs/)|(^\.github/scripts/check-cli-doc-flags\.sh$)|(^crates/nono-cli/src/cli\.rs$) ]]; then
                  run_docs_checks=true
                fi
              done
            fi
          fi

          echo "run_code_jobs=${run_code_jobs}" >> "${GITHUB_OUTPUT}"
          echo "run_docs_checks=${run_docs_checks}" >> "${GITHUB_OUTPUT}"

  test:
    name: Test
    needs: changes
    if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') && needs.changes.outputs.run_code_jobs == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # PINNED — keep in lockstep with /rust-toolchain.toml (see its header).
          # `stable` here floats ahead of local installs and reopens the
          # local-green/CI-red lint gap that file exists to close.
          toolchain: "1.98.1"

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run tests
        run: cargo test --workspace --verbose

  windows-build:
    name: Windows Build
    needs: changes
    if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') && needs.changes.outputs.run_code_jobs == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # PINNED — keep in lockstep with /rust-toolchain.toml (see its header).
          # `stable` here floats ahead of local installs and reopens the
          # local-green/CI-red lint gap that file exists to close.
          toolchain: "1.98.1"

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Windows build harness
        shell: pwsh
        run: .\scripts\windows-test-harness.ps1 -Suite build -LogDir ci-logs

      - name: Upload Windows build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-build-logs
          path: |
            ci-logs\windows-build.log
          if-no-files-found: warn

  windows-smoke:
    name: Windows Smoke
    needs: changes
    if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') && needs.changes.outputs.run_code_jobs == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # PINNED — keep in lockstep with /rust-toolchain.toml (see its header).
          # `stable` here floats ahead of local installs and reopens the
          # local-green/CI-red lint gap that file exists to close.
          toolchain: "1.98.1"

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Windows smoke harness
        shell: pwsh
        run: .\scripts\windows-test-harness.ps1 -Suite smoke -LogDir ci-logs

      - name: Upload Windows smoke logs
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-smoke-logs
          path: ci-logs\windows-smoke.log
          if-no-files-found: warn

  windows-integration:
    name: Windows Integration
    needs: changes
    if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') && needs.changes.outputs.run_code_jobs == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # PINNED — keep in lockstep with /rust-toolchain.toml (see its header).
          # `stable` here floats ahead of local installs and reopens the
          # local-green/CI-red lint gap that file exists to close.
          toolchain: "1.98.1"

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Windows integration harness
        shell: pwsh
        run: .\scripts\windows-test-harness.ps1 -Suite integration -LogDir ci-logs

      - name: Upload Windows integration logs
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-integration-logs
          path: ci-logs\windows-integration.log
          if-no-files-found: warn

  windows-security:
    name: Windows Security
    needs: changes
    if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') && needs.changes.outputs.run_code_jobs == 'true' }}
    runs-on: windows-latest
    env:
      NONO_CI_HAS_WFP: true   # windows-latest runners run as Administrator
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # PINNED — keep in lockstep with /rust-toolchain.toml (see its header).
          # `stable` here floats ahead of local installs and reopens the
          # local-green/CI-red lint gap that file exists to close.
          toolchain: "1.98.1"

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Windows security harness
        shell: pwsh
        run: .\scripts\windows-test-harness.ps1 -Suite security -LogDir ci-logs

      - name: Upload Windows security logs
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-security-logs
          path: ci-logs\windows-security.log
          if-no-files-found: warn

  windows-regression:
    name: Windows Regression
    needs: changes
    if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') && needs.changes.outputs.run_code_jobs == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # PINNED — keep in lockstep with /rust-toolchain.toml (see its header).
          # `stable` here floats ahead of local installs and reopens the
          # local-green/CI-red lint gap that file exists to close.
          toolchain: "1.98.1"

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Windows regression harness
        shell: pwsh
        run: .\scripts\windows-test-harness.ps1 -Suite regression -LogDir ci-logs

      - name: Upload Windows regression logs
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-regression-logs
          path: ci-logs\windows-regression.log
          if-no-files-found: warn

  # This is the ONLY job in this workflow that runs Rust unit tests on
  # Windows — the `test` job's matrix is [ubuntu-latest, macos-latest].
  # Because the cargo invocations below carry no `--bin`/`--test`/`--lib`
  # target filter, they run every target in the package, including the
  # `nono` bin's unit tests. That is what covers the Phase 117 WR-20 pin,
  # labels_guard.rs::non_owned_path_with_a_foreign_label_is_exempt_not_a_coverage_gap,
  # which asserts that a non-owned + foreign-labelled path is contract-exempt
  # rather than a coverage gap. That test needs SeTakeOwnershipPrivilege and
  # is host-blocked on the dev box, where it fails LOUDLY per D-31 rather
  # than skipping — so what it needs is a RUN here, not extra wiring.
  # Corollary: because this job runs the whole package suite, it also
  # inherits the documented Windows-host baseline failures.
  windows-layer-fault-injection:
    name: Windows Layer Fault Injection
    needs: changes
    if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') && needs.changes.outputs.run_code_jobs == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # PINNED — keep in lockstep with /rust-toolchain.toml (see its header).
          # `stable` here floats ahead of local installs and reopens the
          # local-green/CI-red lint gap that file exists to close.
          toolchain: "1.98.1"

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Plan 117-18 (NR-08): several nono-sandbox-cli tests spawn the real
      # broker binary (e.g. broker_dispatch_tests::*, the broker-arm paths
      # in apply_startup_attestation_gate) and panic! with an explicit
      # "pre-build with `cargo build -p nono-shell-broker --release`"
      # message when it is absent (launch.rs). Building it here turns that
      # panic into the CI job actually exercising the real broker-dependent
      # path instead of depending on incidental artifact presence.
      - name: Build nono-shell-broker (release)
        run: cargo build -p nono-shell-broker --release

      # Phase 117 review CR-10. Without this job the CINT-03
      # forced-unavailable suites, the eight in-crate seam regression tests,
      # the D-32 `every_registry_row_has_a_test` discovery gate and the four
      # Windows block-net enforcement tests (CR-08) execute in NO gate at
      # all. The SPEC claims these "fail the build"; this is the build.
      # One cargo command per step, deliberately: a pwsh step's status is the
      # exit code of its LAST native command, so combining these two legs into
      # a single `run:` block makes a failing first leg invisible whenever the
      # second leg passes. Observed live on run 31888431118 (2026-08-15), where
      # this job logged `test result: FAILED. 1684 passed; 22 failed` and still
      # reported `conclusion: success`. Do not recombine.
      # `--test-threads=1` is load-bearing: every force-unavailable seam is a
      # process-global AtomicBool, so parallel execution lets one test's armed
      # flag leak into another test's real apply call.
      - name: Run layer-fault-injection suites (nono-sandbox-cli)
        run: cargo test -p nono-sandbox-cli --features layer-fault-injection -- --test-threads=1

      # Second leg of the CR-10 pair above; same --test-threads=1 rationale.
      - name: Run layer-fault-injection suites (nono-shell-broker)
        run: cargo test -p nono-shell-broker --features layer-fault-injection -- --test-threads=1

  windows-packaging:
    name: Windows Packaging
    needs: changes
    if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') && needs.changes.outputs.run_code_jobs == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # PINNED — keep in lockstep with /rust-toolchain.toml (see its header).
          # `stable` here floats ahead of local installs and reopens the
          # local-green/CI-red lint gap that file exists to close.
          toolchain: "1.98.1"

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # These two release builds are one cargo command per step, deliberately.
      # A pwsh step's status is the exit code of its LAST native command, so a
      # failed nono-sandbox-cli build would pass the step whenever the broker
      # build then succeeded, letting a broken nono.exe reach packaging. Same
      # class as the fail-open observed live in the Windows Layer Fault
      # Injection job on run 31888431118 (2026-08-15). Do not recombine.
      # Both steps carry the same RUSTFLAGS block on purpose: dropping it from
      # either one silently changes what is built.
      - name: "Build release binary: nono-sandbox-cli"
        shell: pwsh
        env:
          RUSTFLAGS: -Dwarnings -C target-feature=+crt-static
        run: cargo build --release -p nono-sandbox-cli

      - name: "Build release binary: nono-shell-broker"
        shell: pwsh
        env:
          RUSTFLAGS: -Dwarnings -C target-feature=+crt-static
        run: cargo build --release -p nono-shell-broker

      - name: Validate Windows MSI contract
        shell: pwsh
        run: |
          # Quick task 260522-c9c: thread the pre-signed WFP driver path so the
          # validator exercises the new cmpWfpDriverSys component and the
          # scope-coherence guard inside build-windows-msi.ps1. The driver
          # source is the checked-in pre-signed copy under
          # crates/nono-cli/data/windows/ (NOT the dev build artifact under
          # target/) so CI verifies the release MSI's actual driver layout.
          $driver = ".\crates\nono-cli\data\windows\nono-wfp-driver.sys"
          if (-not (Test-Path $driver)) {
            Write-Error "Missing checked-in WFP driver binary: $driver"
            exit 1
          }
          .\scripts\validate-windows-msi-contract.ps1 `
            -BinaryPath .\target\release\nono.exe `
            -BrokerPath .\target\release\nono-shell-broker.exe `
            -ServiceBinaryPath .\target\release\nono-wfp-service.exe `
            -DriverBinaryPath $driver

  fmt:
    name: Rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.run_code_jobs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # PINNED — keep in lockstep with /rust-toolchain.toml (see its header).
          # `stable` here floats ahead of local installs and reopens the
          # local-green/CI-red lint gap that file exists to close.
          toolchain: "1.98.1"
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  ffi-header:
    name: Verify FFI Header
    needs: changes
    if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') && needs.changes.outputs.run_code_jobs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # PINNED — keep in lockstep with /rust-toolchain.toml (see its header).
          # `stable` here floats ahead of local installs and reopens the
          # local-green/CI-red lint gap that file exists to close.
          toolchain: "1.98.1"

      - name: Build nono-ffi (regenerates header)
        run: cargo build -p nono-ffi

      - name: Verify nono.h is up-to-date
        run: |
          if ! git diff --exit-code bindings/c/include/nono.h; then
            echo "ERROR: bindings/c/include/nono.h is out of date"
            echo "Run 'cargo build -p nono-ffi' and commit the updated header"
            exit 1
          fi

  clippy:
    name: Clippy
    needs: changes
    if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') && needs.changes.outputs.run_code_jobs == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Phase 117 review WR-09: windows-latest added. The matrix was
      # [ubuntu-latest, macos-latest], so EVERY `#[cfg(target_os = "windows")]`
      # file — the whole exec_strategy_windows/ tree, agent_daemon/launch.rs's
      # windows_impl, telemetry/windows.rs, the Windows halves of
      # cli_bootstrap.rs and output.rs, and nono-shell-broker — was never
      # linted at all. The Windows test jobs set `RUSTFLAGS: -Dwarnings`,
      # which catches rustc warnings but NOT clippy-only lints, and CLAUDE.md
      # makes `clippy::unwrap_used` a hard project rule. This was a missing
      # gate rather than a live violation: the exact command below was run
      # locally on Windows before adding this leg and exited 0.
      #
      # `--all-features` includes `layer-fault-injection`, so the seam code
      # the `windows-layer-fault-injection` job exercises is linted here too.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # PINNED — keep in lockstep with /rust-toolchain.toml (see its header).
          # `stable` here floats ahead of local installs and reopens the
          # local-green/CI-red lint gap that file exists to close.
          toolchain: "1.98.1"
          components: clippy

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::unwrap_used

  integration:
    name: Integration Tests
    needs: changes
    if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') && needs.changes.outputs.run_code_jobs == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # PINNED — keep in lockstep with /rust-toolchain.toml (see its header).
          # `stable` here floats ahead of local installs and reopens the
          # local-green/CI-red lint gap that file exists to close.
          toolchain: "1.98.1"

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Run integration tests
        run: |
          if [[ -f ./tests/run_integration_tests.sh ]]; then
            ./tests/run_integration_tests.sh
          else
            echo "No integration tests found, skipping"
          fi

  audit:
    name: Cargo Audit
    needs: changes
    if: ${{ needs.changes.outputs.run_code_jobs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          # PINNED — keep in lockstep with /rust-toolchain.toml (see its header).
          # `stable` here floats ahead of local installs and reopens the
          # local-green/CI-red lint gap that file exists to close.
          toolchain: "1.98.1"

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  cross-compile:
    name: Cross-compile check ${{ matrix.target }}
    needs: changes
    # Fork model: operator-invoked pre-release check via workflow_dispatch, not the
    # upstream chore: release v...' PR-title convention (release-please-bot pattern
    # that never fires on this fork's tag-push/workflow_dispatch release model).
    # if: form is the pre-corrected quoted-string form from #1251 applied inline.
    if: "github.event_name == 'workflow_dispatch' && needs.changes.outputs.run_code_jobs == 'true'"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} -p nono-sandbox-cli

      - name: Build (cross aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target aarch64-unknown-linux-gnu -p nono-sandbox-cli

      - name: Verify binary does not link libdbus (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/nono"
          needed="$(objdump -p "$bin" | awk '/NEEDED/ {print $2}')"
          echo "NEEDED libraries for $bin:"
          echo "$needed"
          if echo "$needed" | grep -qi '^libdbus'; then
            echo "::error::$bin links libdbus — the release binary is not portable"
            exit 1
          fi
          echo "OK: no libdbus dependency"

  docs-checks:
    name: Docs Checks
    needs: changes
    if: ${{ needs.changes.outputs.run_docs_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Verify docs routes are canonical
        run: |
          if rg -n -P 'href="/(?!cli/|assets/)|\]\(/(?!cli/|assets/)' docs/cli; then
            echo "Found non-canonical absolute docs links in docs/cli."
            exit 1
          fi

      - name: Verify docs nav pages exist
        run: |
          jq -r '.navigation.groups[].pages[]' docs/docs.json | while read -r page; do
            if [[ ! -f "docs/${page}.mdx" ]]; then
              echo "Missing page from docs.json navigation: docs/${page}.mdx"
              exit 1
            fi
          done

      - name: Verify CLI run flags are documented
        run: |
          chmod +x .github/scripts/check-cli-doc-flags.sh
          .github/scripts/check-cli-doc-flags.sh
