[package]
name = "nono-sandbox"
version = "0.70.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Capability-based sandboxing library using Landlock (Linux) and Seatbelt (macOS)"
readme = "README.md"
keywords = ["sandbox", "security", "capability", "landlock", "seatbelt"]
categories = ["os", "api-bindings"]

# [lib] name pinned to "nono" (Rule 3 auto-fix, 102-01 Task 3 deviation): without an
# explicit [lib] section, Cargo derives the default library crate name from [package]
# name with hyphens converted to underscores -- i.e. "nono_sandbox" after this rename.
# That default is invisible to external consumers (they resolve the extern crate name
# from their OWN dependency-table key via `package = "nono-sandbox"`, per 102-RESEARCH.md,
# completely independent of this producer's [lib] name), but it DOES break this crate's
# own integration tests under tests/*.rs, which link against the library via the implicit
# default lib name and use bare `use nono::...` imports. Pinning [lib] name here keeps
# those in-crate `use nono::` imports byte-for-byte unchanged, with zero effect on the
# package= consumer mechanism used by nono-proxy/nono-cli/nono-shell-broker/nono-ffi.
[lib]
name = "nono"

[features]
default = ["system-keyring"]
# Enables OS system keyring access (macOS Keychain / Linux Secret Service).
# Headless/container consumers opt out with default-features = false.
system-keyring = ["dep:keyring"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
zeroize.workspace = true
sha2.workspace = true
getrandom = { workspace = true }
walkdir.workspace = true
ignore.workspace = true
globset.workspace = true
regress = "0.11"

# URL component parsing for fail-closed OIDC issuer pinning (D-11 / T-20-04-03)
url.workspace = true

# Unix socket IPC for supervisor
libc = "0.2"

# Keychain access (optional: requires libdbus on Linux)
keyring = { version = "3", optional = true }

# Sigstore bundle verification
# Phase 37 Plan 37-06: bumped 0.6.5 → 0.7.0 to pick up upstream sigstore-rust PR #85
# (merged 2026-04-29, released 2026-05-13). Breaking API: `VerificationPolicy::verify_sct: bool`
# field added — `::default()` and builder methods (`with_issuer`, `skip_sct`) are unaffected,
# and nono uses only those constructors (no struct-literal `VerificationPolicy { ... }` sites
# in-tree, verified via `grep -rnE "VerificationPolicy\s*\{" crates/`).
sigstore-verify = { version = "0.8.0", default-features = false, features = ["tuf"] }
# Phase 99 Plan 99-05: replay upstream 2e64798d (#1229) as a deferred-cascade marker.
# IMPORTANT: this direct pin has NO runtime effect today. Attestation verification still
# runs entirely on trust-root 0.8.0, pulled in transitively by sigstore-verify 0.8.0 above —
# the effective TUF root in use is 0.8.0, NOT 0.9.0. Cargo resolves both versions side by
# side (dual-version). The 0.9.0 pin only records the upstream-coherent target version and
# is unreferenced by any code in crates/nono/src/ until sigstore-verify is bumped to 0.9.0
# (upstream 9e084cbb), which RESEARCH cascade assumption A1 intentionally deferred to a
# future sync phase. Removal-vs-keep is tracked in 99-HUMAN-UAT.md (WR-01).
sigstore-trust-root = "=0.9.0"
x509-cert = { version = "0.2", default-features = false }
der = { version = "0.7", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
nix = { workspace = true, features = ["fs", "user"] }
keyring = { version = "3", features = ["sync-secret-service"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["fs", "user"] }
keyring = { version = "3", features = ["apple-native"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading", "Wdk_System_SystemServices", "Win32_System_SystemInformation"] }
# D-10: winreg is the Windows-only registry reader for machine egress policy.
# Operator-approved 2026-06-18: crates.io = gentoo90/winreg-rs @ 0.56.x, MIT, 179M+ downloads.
# NEVER move this to the unconditional [dependencies] table — non-Windows targets must not pull it (Pitfall 5).
winreg = "0.56"
keyring = { version = "3", features = ["windows-native"], optional = true }

[build-dependencies]
typify = "0.7"
serde_json = "1"
syn = "2"
prettyplease = "0.2"

[dev-dependencies]
tempfile.workspace = true
jsonschema = "0.46"
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
