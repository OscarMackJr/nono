[package]
name = "nono-shell-broker"
version = "0.70.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Medium-IL broker for spawning Low-IL nono shell children on Windows"
keywords = ["sandbox", "security", "windows", "broker"]
categories = ["os::windows-apis"]

[[bin]]
name = "nono-shell-broker"
path = "src/main.rs"

[features]
# Enables per-layer force-unavailable hooks for CINT-03 forced-unavailable
# tests. NEVER enable in a release build — D-30: this must be compiled out,
# not merely refused at runtime.
layer-fault-injection = []

[dependencies]
nono = { version = "0.70.0", path = "../nono", package = "nono-sandbox" }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Phase 118 Plan 06 (D-15): JSONL serialization for this binary's own
# hand-rolled enforcement-receipt sink writer. `sha2` is not needed
# directly — `nono::hash_receipt_event`/`hash_receipt_chain` (core) already
# wrap it.
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
# Phase 118 Plan 06: tempdir-backed tests for the hand-rolled receipt-sink
# guard/writer, mirroring `receipt_sink.rs`'s own test shape.
tempfile = "3"

[lints]
workspace = true
