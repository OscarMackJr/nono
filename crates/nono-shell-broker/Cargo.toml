[package]
name = "nono-shell-broker"
version = "0.70.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Medium-IL broker for spawning Low-IL nono shell children on Windows"
keywords = ["sandbox", "security", "windows", "broker"]
categories = ["os::windows-apis"]

[[bin]]
name = "nono-shell-broker"
path = "src/main.rs"

[features]
# Enables per-layer force-unavailable hooks for CINT-03 forced-unavailable
# tests. NEVER enable in a release build — D-30: this must be compiled out,
# not merely refused at runtime.
layer-fault-injection = []

[dependencies]
nono = { version = "0.70.0", path = "../nono", package = "nono-sandbox" }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_SystemServices",
] }

[lints]
workspace = true
