[package]
name = "nono-sandbox-proxy"
version = "0.70.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Network filtering proxy for the nono sandbox"
keywords = ["sandbox", "security", "proxy", "network"]
categories = ["network-programming", "web-programming"]

# [lib] name pinned to "nono_proxy" (Rule 3 auto-fix, Plan 113-07 — mirrors the
# identical fix already applied to crates/nono/Cargo.toml in Phase 102's
# fork-owned rename). Without an explicit [lib] section, Cargo derives the
# default library crate name from [package] name with hyphens converted to
# underscores -- i.e. "nono_sandbox_proxy". That default is invisible to
# external consumers (nono-cli resolves the extern crate name "nono_proxy"
# from its OWN dependency-table key `nono-proxy = { package = "nono-sandbox-proxy" }`,
# independent of this producer's [lib] name), but it DOES break this crate's
# own first integration-test file (crates/nono-proxy/tests/spiffe_integration.rs,
# Plan 113-07), which links against the library via the implicit default lib
# name and uses bare `use nono_proxy::...` imports (matching upstream
# `c831dade`'s own test file). Pinning [lib] name here keeps those in-crate
# imports byte-for-byte unchanged, with zero effect on the package= consumer
# mechanism nono-cli already uses.
[lib]
name = "nono_proxy"

[features]
default = ["system-keyring"]
# Enables OS system keyring access (macOS Keychain / Windows Credential Manager
# / Linux kernel keyutils). Delegates entirely to nono; no direct keyring dep.
# Headless/container consumers opt out with default-features = false.
system-keyring = ["nono/system-keyring"]

[dependencies]
nono = { version = "0.70.0", path = "../nono", package = "nono-sandbox", default-features = false }
tokio.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["client-legacy"] }
http-body-util.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
zeroize.workspace = true
sha2.workspace = true
getrandom = { workspace = true }
base64 = "0.22"
subtle = "2"
url = "2"
urlencoding = "2"
globset.workspace = true

# TLS for upstream connections (reverse proxy mode)
hyper-rustls = { version = "0.27", features = ["http1", "http2", "ring", "webpki-tokio"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
webpki-roots = "1"
# Read the host's system trust store. Combined with webpki-roots so upstream
# TLS handshakes succeed on corporate networks with TLS-inspection MITM
# (which trust their own root via the OS trust store, not webpki defaults).
# Replays the security intent of upstream 8ddb143 / 54c7552 native-CA loading
# WITHOUT pulling in upstream's tls_intercept module (not in fork; per D-40-B2).
rustls-native-certs = "0.8"
# HTTP body framing used by pool.rs (UpstreamPool request body type)
bytes = "1"
# Typed HTTP request/response used by pool.rs
http = "1"
# SPIFFE/SPIRE Workload API client (JWT-SVID fetch/cache). D-05: jwt-source
# feature only; the JNI/Android path arriving via rustls-platform-verifier
# must be proven cfg-gated-out per target (D-05(c), verified in Plan 113-08).
spiffe-workload = { package = "spiffe", version = "0.16", features = ["jwt-source"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["test-util", "rt-multi-thread", "macros"] }
# Hermetic self-signed cert generation for Plan 114-06 Task 3's live
# TLS-upstream dispatch-path test (`capture_egress_resolution_reaches_upstream_on_live_dispatch_path`)
# — the only test in this crate that drives a request through
# `handle_reverse_proxy` all the way to a real (fake) upstream, which
# requires a real TLS server since `connect_upstream_tls` is unconditional.
# Already a vetted, already-resolved workspace dependency (crates/nono-cli/Cargo.toml,
# used identically by `tests/keyless_verify.rs`'s hermetic cert fixture) —
# not a new external dependency introduced by this plan.
rcgen = "0.13"

[lints]
workspace = true
