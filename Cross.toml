# cross-rs configuration for cross-compilation
# https://github.com/cross-rs/cross/wiki/Configuration
#
# INTENTIONALLY EMPTY of pre-build steps as of quick task 260907-arx.
#
# This file previously did exactly one thing: install libdbus-1-dev into both
# Linux images (plus the arm64 multiarch dance and PKG_CONFIG_PATH/LIBRARY_PATH
# passthrough for aarch64) so that the `keyring` crate's `sync-secret-service`
# feature could link against `dbus-1.pc`. That was D-50-13 / Codex R-50-04,
# required at the time for a Phase 50 cross-target clippy HARD pass.
#
# The operator has since moved the Linux keyring backend to `linux-native`
# (kernel keyutils). `libdbus-sys`, `dbus-secret-service`, `dbus` and
# `pkg-config` are all gone from the Linux dependency graph -- verified with
# `cargo tree --target x86_64-unknown-linux-gnu -p nono-sandbox-cli -i
# libdbus-sys`, which now reports no such package. So the provisioning this file
# existed to perform has nothing left to provision.
#
# The rationale is recorded here rather than the file being deleted, because a
# silently absent Cross.toml would leave the next reader unable to tell "we never
# needed one" from "someone removed it by mistake". If a future dependency does
# need a system library in the cross image, add a `[target.<triple>] pre-build`
# block here and say which crate needs it and why -- the failure mode this whole
# episode came from was a provisioning step whose stated reason had quietly
# stopped being true.
